name: Desktop verify

on:
  push:
    branches:
      - desktop
  pull_request:
    branches:
      - desktop

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix frontend

      - name: Verify desktop
        run: npm run verify:desktop

      - name: Test desktop updater, hardening, runtime policy, project persistence and Project Center model
        run: |
          node --check backend/services/meterSphereProjectConfigService.js
          node --check backend/controllers/meterSphereProjectController.js
          node --check backend/routes/meterSphereProject.js
          npm test -- --runInBand
          npm run test:frontend

      - name: Reliability behavior regression
        run: npm run test:reliability
