name: Desktop release

on:
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          # 需要完整 tag 历史，用于判断 Live2D 模型层是否变更
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#desktop-v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [[ "$VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "Tag 版本 desktop-v$VERSION 与 package.json 版本 $PACKAGE_VERSION 不一致" >&2
            exit 1
          fi
          if [[ ! -f build/icon.icns ]]; then
            echo "缺少 build/icon.icns；正式 Desktop Release 必须包含 App 图标" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix frontend

      - name: Verify desktop
        run: npm run verify:desktop

      - name: Test desktop updater networking
        run: npm test -- --runInBand backend/__tests__/desktopUpdateService.test.js

      - name: Build x64 and arm64 release assets
        run: |
          rm -rf dist
          npx electron-builder --mac --x64 --arm64 --publish never

      - name: Build delta packages
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_TAG="$GITHUB_REF_NAME"
          PREV_TAG="$(git tag --list 'desktop-v*' --sort=-v:refname | grep -vx "$CURRENT_TAG" | head -1 || true)"
          # Live2D 模型层（约 300MB）版本间通常不变；未变更时增量包不携带，安装时从旧包恢复。
          LIVE2D_CHANGED=true
          if [[ -n "$PREV_TAG" && -z "$(git diff --name-only "$PREV_TAG" HEAD -- frontend/public/live2d)" ]]; then
            LIVE2D_CHANGED=false
          fi
          ELECTRON_VERSION="$(node -p "require('electron/package.json').version")"
          echo "PREV_TAG=${PREV_TAG:-<none>} LIVE2D_CHANGED=$LIVE2D_CHANGED ELECTRON_VERSION=$ELECTRON_VERSION"
          {
            echo "LIVE2D_CHANGED=$LIVE2D_CHANGED"
            echo "ELECTRON_VERSION=$ELECTRON_VERSION"
          } >> "$GITHUB_ENV"

          find dist -maxdepth 3 -type d -name "Local Service Hub.app" | while read -r APP; do
            LIPO_ARCHS="$(lipo -archs "$APP/Contents/MacOS/Local Service Hub")"
            case "$LIPO_ARCHS" in
              *arm64*) ARCH="arm64" ;;
              *x86_64*) ARCH="x64" ;;
              *) echo "无法识别的架构: $LIPO_ARCHS" >&2; exit 1 ;;
            esac
            STAGE="$PWD/.delta-stage-$ARCH"
            rm -rf "$STAGE"
            mkdir -p "$STAGE/Contents/Resources"
            cp "$APP/Contents/Info.plist" "$STAGE/Contents/Info.plist"
            ditto "$APP/Contents/Resources/app" "$STAGE/Contents/Resources/app"
            if [[ "$LIVE2D_CHANGED" != "true" ]]; then
              rm -rf "$STAGE/Contents/Resources/app/frontend/dist/live2d"
            fi
            ditto -c -k "$STAGE" "dist/Local-Service-Hub-${VERSION}-${ARCH}-delta.zip"
            rm -rf "$STAGE"
          done

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          for ARCH in x64 arm64; do
            test -f "dist/Local-Service-Hub-${VERSION}-${ARCH}.zip"
            test -f "dist/Local-Service-Hub-${VERSION}-${ARCH}.dmg"
            test -f "dist/Local-Service-Hub-${VERSION}-${ARCH}-delta.zip"
          done
          ls -lh dist/*.zip dist/*.dmg

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip dist/*.dmg --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/*.zip dist/*.dmg \
              --repo "$GITHUB_REPOSITORY" \
              --title "Local Service Hub v${VERSION}" \
              --generate-notes
          fi
          gh release edit "$TAG" --latest --repo "$GITHUB_REPOSITORY"

      - name: Generate latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body,url,publishedAt > release-info.json
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');

          const version = process.env.VERSION;
          const tag = process.env.GITHUB_REF_NAME;
          const repository = process.env.GITHUB_REPOSITORY;
          const release = JSON.parse(fs.readFileSync('release-info.json', 'utf8'));

          const assets = [];
          for (const arch of ['x64', 'arm64']) {
            for (const type of ['zip', 'dmg']) {
              const name = `Local-Service-Hub-${version}-${arch}.${type}`;
              const file = path.join('dist', name);
              const sha256 = crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
              assets.push({
                name,
                arch,
                type,
                bytes: fs.statSync(file).size,
                sha256,
                url: `https://github.com/${repository}/releases/download/${tag}/${encodeURIComponent(name)}`
              });
            }
          }

          const deltas = [];
          if (process.env.ELECTRON_VERSION) {
            for (const arch of ['x64', 'arm64']) {
              const name = `Local-Service-Hub-${version}-${arch}-delta.zip`;
              const file = path.join('dist', name);
              const sha256 = crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
              deltas.push({
                name,
                arch,
                bytes: fs.statSync(file).size,
                sha256,
                url: `https://github.com/${repository}/releases/download/${tag}/${encodeURIComponent(name)}`,
                electronVersion: process.env.ELECTRON_VERSION,
                includesLive2d: process.env.LIVE2D_CHANGED === 'true'
              });
            }
          }

          const payload = {
            version,
            tag,
            publishedAt: release.publishedAt || new Date().toISOString(),
            releaseUrl: release.url || `https://github.com/${repository}/releases/tag/${tag}`,
            notes: release.body || '',
            assets,
            deltas
          };
          fs.writeFileSync('latest.json', `${JSON.stringify(payload, null, 2)}\n`);
          console.log(fs.readFileSync('latest.json', 'utf8'));
          NODE

      - name: Upload latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" latest.json --clobber --repo "$GITHUB_REPOSITORY"
