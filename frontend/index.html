    <!-- Live2D 看板娘 -->
    <script>
      const live2d_path = 'https://fastly.jsdelivr.net/npm/live2d-widgets@1.0.0/dist/';
      function loadExternalResource(url, type) {
        return new Promise((resolve, reject) => {
          let tag;
          if (type === 'css') {
            tag = document.createElement('link');
            tag.rel = 'stylesheet';
            tag.href = url;
          } else if (type === 'js') {
            tag = document.createElement('script');
            tag.type = 'module';
            tag.src = url;
          }
          if (tag) {
            tag.onload = () => resolve(url);
            tag.onerror = () => reject(url);
            document.head.appendChild(tag);
          }
        });
      }
      (async () => {
        const OriginalImage = window.Image;
        window.Image = function(...args) {
          const img = new OriginalImage(...args);
          img.crossOrigin = "anonymous";
          return img;
        };
        window.Image.prototype = OriginalImage.prototype;
        await Promise.all([
          loadExternalResource(live2d_path + 'waifu.css', 'css'),
          loadExternalResource(live2d_path + 'waifu-tips.js', 'js')
        ]);
        initWidget({
          waifuPath: live2d_path + 'waifu-tips.json',
          cubism2Path: live2d_path + 'live2d.min.js',
          cubism5Path: 'https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js',
          tools: ['hitokoto', 'asteroids', 'switch-model', 'switch-texture', 'photo', 'info', 'chat', 'quit'],
          logLevel: 'warn',
          drag: true,
        });
      })();
    </script>
    <!-- 看板娘聊天功能 -->
    <script>
      (function() {
        let chatMode = false;
        let sessionId = 'waifu-' + Date.now();

        function waitForWaifu() {
          return new Promise(resolve => {
            const check = () => {
              const tips = document.getElementById('waifu-tips');
              const tool = document.getElementById('waifu-tool');
              if (tips && tool) return resolve({ tips, tool });
              setTimeout(check, 200);
            };
            check();
          });
        }

        function createChatIcon(toolBar) {
          // live2d-widgets 用内联 SVG 作图标，chat 不在其内置列表中，需手动创建 SVG 图标
          const existing = toolBar.querySelector('span[data-tool="chat"]');
          if (existing) {
            // 如果已存在但内容为空（FA class 无效），填充 SVG
            if (!existing.querySelector('svg')) {
              existing.className = '';
              existing.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><path d="M256 32C114.6 32 0 125.1 0 240c0 49.6 21.4 95 57 130.7C44.5 421.1 2.7 466 2.2 466.5c-2.2 2.3-2.8 5.7-1.5 8.7S4.8 480 8 480c66.3 0 116-31.8 140.6-51.4 34.4 12.5 72 19.4 107.4 19.4 141.4 0 256-93.1 256-208S397.4 32 256 32z"/></svg>';
            }
            existing.addEventListener('click', toggleChatMode);
            return;
          }
          const icon = document.createElement('span');
          icon.dataset.tool = 'chat';
          icon.title = 'AI 聊天';
          icon.style.cursor = 'pointer';
          icon.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><path d="M256 32C114.6 32 0 125.1 0 240c0 49.6 21.4 95 57 130.7C44.5 421.1 2.7 466 2.2 466.5c-2.2 2.3-2.8 5.7-1.5 8.7S4.8 480 8 480c66.3 0 116-31.8 140.6-51.4 34.4 12.5 72 19.4 107.4 19.4 141.4 0 256-93.1 256-208S397.4 32 256 32z"/></svg>';
          // 插入到 quit 图标之前
          const quitIcon = toolBar.querySelector('span[data-tool="quit"]');
          if (quitIcon) {
            toolBar.insertBefore(icon, quitIcon);
          } else {
            toolBar.appendChild(icon);
          }
          icon.addEventListener('click', toggleChatMode);
        }

        function toggleChatMode() {
          chatMode = !chatMode;
          const tips = document.getElementById('waifu-tips');
          if (!tips) return;

          if (chatMode) {
            enterChatMode(tips);
          } else {
            exitChatMode(tips);
          }
        }

        // 聊天 UI 的 HTML 模板
        const CHAT_HTML = `
            <div class="waifu-chat-container">
              <div class="waifu-chat-messages" id="waifu-chat-messages">
                <div class="waifu-chat-msg waifu-chat-ai">你好呀~ 我是小梦，有什么可以帮你的吗？(&#9685;&#7447;&#9685;&#10047;)</div>
              </div>
              <div class="waifu-chat-input-wrap">
                <textarea id="waifu-chat-input" placeholder="输入消息... (Enter 发送)" rows="1"></textarea>
              </div>
            </div>`;

        // 保存聊天消息历史（供恢复时使用）
        let chatMessagesHTML = null;

        function enterChatMode(tips) {
          // 保存原始内容
          tips._originalHTML = tips.innerHTML;
          tips._originalStyle = tips.style.cssText;

          tips.classList.add('waifu-chat-mode');

          // 恢复之前的聊天内容 or 使用初始模板
          tips.innerHTML = chatMessagesHTML || CHAT_HTML;

          // 强制保持可见
          function forceVisible() {
            tips.style.opacity = '1';
            tips.style.visibility = 'visible';
            tips.style.display = 'block';
          }
          forceVisible();

          // 拦截 live2d-widgets 的 showMessage：劫持 innerHTML setter
          if (!tips._origInnerHTMLDescriptor) {
            tips._origInnerHTMLDescriptor = Object.getOwnPropertyDescriptor(Element.prototype, 'innerHTML');
          }

          const origDesc = tips._origInnerHTMLDescriptor;
          Object.defineProperty(tips, 'innerHTML', {
            configurable: true,
            get() {
              return origDesc.get.call(this);
            },
            set(val) {
              if (chatMode && !val.includes('waifu-chat-container')) {
                forceVisible();
                return;
              }
              origDesc.set.call(this, val);
            }
          });

          // 拦截 style 变更
          if (!tips._chatStyleObserver) {
            tips._chatStyleObserver = new MutationObserver(() => {
              if (chatMode) forceVisible();
            });
            tips._chatStyleObserver.observe(tips, { attributes: true, attributeFilter: ['style'] });
          }

          const input = document.getElementById('waifu-chat-input');
          if (input) {
            input.focus();
            input.addEventListener('keydown', handleChatKeydown);
            input.addEventListener('input', autoResizeInput);
          }

          const chatIcon = document.querySelector('#waifu-tool span[data-tool="chat"]');
          if (chatIcon) chatIcon.classList.add('waifu-chat-active');
        }

        function exitChatMode(tips) {
          const messagesEl = document.getElementById('waifu-chat-messages');
          if (messagesEl) {
            chatMessagesHTML = tips.innerHTML;
          }

          tips.classList.remove('waifu-chat-mode');

          if (tips._chatStyleObserver) {
            tips._chatStyleObserver.disconnect();
            tips._chatStyleObserver = null;
          }

          if (tips._origInnerHTMLDescriptor) {
            delete tips.innerHTML;
          }

          if (tips._originalHTML !== undefined) {
            tips.innerHTML = tips._originalHTML;
          }
          if (tips._originalStyle !== undefined) {
            tips.style.cssText = tips._originalStyle;
          }

          const chatIcon = document.querySelector('#waifu-tool span[data-tool="chat"]');
          if (chatIcon) chatIcon.classList.remove('waifu-chat-active');
        }

        function autoResizeInput() {
          this.style.height = 'auto';
          this.style.height = Math.min(this.scrollHeight, 60) + 'px';
        }

        function handleChatKeydown(e) {
          if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            const input = e.target;
            const message = input.value.trim();
            if (!message) return;
            input.value = '';
            input.style.height = 'auto';
            sendChatMessage(message);
          }
        }

        async function sendChatMessage(message) {
          const messagesEl = document.getElementById('waifu-chat-messages');
          if (!messagesEl) return;

          appendMessage(messagesEl, message, 'user');
          const loadingEl = appendMessage(messagesEl, '思考中...', 'ai loading');

          const input = document.getElementById('waifu-chat-input');
          if (input) input.disabled = true;

          // 聊天时触发说话动画
          if (window.__waifuModelCtrl) {
            window.__waifuModelCtrl.startSpeaking();
          }

          try {
            const res = await fetch('/api/chat/message', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ message, sessionId })
            });
            const data = await res.json();
            loadingEl.remove();

            if (data.success) {
              appendMessage(messagesEl, data.data.reply, 'ai');
              // 收到回复时播放说话动画
              if (window.__waifuModelCtrl) {
                window.__waifuModelCtrl.speakForDuration(data.data.reply.length * 80);
              }
            } else {
              appendMessage(messagesEl, '出错了: ' + (data.error?.message || '未知错误'), 'ai error');
            }
          } catch (err) {
            loadingEl.remove();
            appendMessage(messagesEl, '网络错误，请检查后端服务~', 'ai error');
          } finally {
            if (window.__waifuModelCtrl) {
              window.__waifuModelCtrl.stopSpeaking();
            }
            if (input) {
              input.disabled = false;
              input.focus();
            }
          }
        }

        function appendMessage(container, text, type) {
          const div = document.createElement('div');
          const classes = type.split(' ').map(c => c === 'user' ? 'waifu-chat-user' : c === 'ai' ? 'waifu-chat-ai' : `waifu-chat-${c}`);
          div.className = 'waifu-chat-msg ' + classes.join(' ');
          div.textContent = text;
          container.appendChild(div);
          container.scrollTop = container.scrollHeight;
          return div;
        }

        waitForWaifu().then(({ tool }) => {
          createChatIcon(tool);
        });
      })();
    </script>
    <!-- 看板娘互动增强：视线跟随 + 点击弹跳 + 说话动画 -->
    <script>
      (function() {
        // ========== 情绪表情预设 ==========
        const EMOTIONS = {
          happy: { ParamEyeLSmile: 1, ParamEyeRSmile: 1, ParamMouthForm: 1, ParamMouthOpenY: 0.3, ParamCheek: 0.5 },
          surprise: { ParamEyeLOpen: 1.2, ParamEyeROpen: 1.2, ParamBrowLY: 1, ParamBrowRY: 1, ParamMouthOpenY: 0.8, ParamMouthForm: 0 },
          shy: { ParamAngleX: -10, ParamAngleY: -5, ParamCheek: 1, ParamEyeLOpen: 0.6, ParamEyeROpen: 0.6, ParamEyeBallX: -0.5, ParamEyeBallY: -0.3 },
          worried: { ParamBrowLY: -0.5, ParamBrowRY: -0.5, ParamMouthForm: -1, ParamEyeLOpen: 0.8, ParamEyeROpen: 0.8 },
          angry: { ParamBrowLAngle: -1, ParamBrowRAngle: -1, ParamBrowLY: -1, ParamBrowRY: -1, ParamMouthForm: -2 }
        };

        // ========== 模型控制器 ==========
        const modelCtrl = {
          coreModel: null,
          paramOverrides: {},
          gazeEnabled: true,
          speaking: false,
          speakTimer: null,
          bouncing: false,
          emotionTarget: null,
          emotionEndTime: 0,
          emotionCurrent: {},

          // 捕获 CubismCore 模型实例
          init() {
            this._waitForModel();
          },

          _waitForModel() {
            const check = () => {
              if (!window.Live2DCubismCore || !window.Live2DCubismCore.Model) {
                return setTimeout(check, 500);
              }
              // Patch update 方法捕获模型实例
              const origUpdate = Live2DCubismCore.Model.prototype.update;
              const self = this;
              Live2DCubismCore.Model.prototype.update = function() {
                if (!self.coreModel) {
                  self.coreModel = this;
                  self._installOverrideHook();
                }
                return origUpdate.call(this);
              };
              // 一帧后恢复原始 update（仅用于捕获）
              requestAnimationFrame(() => {
                setTimeout(() => {
                  Live2DCubismCore.Model.prototype.update = origUpdate;
                }, 100);
              });
            };
            check();
          },

          // 在模型 update 后注入参数覆盖
          _installOverrideHook() {
            const model = this.coreModel;
            const params = model.parameters;
            const origUpdate = model.update.bind(model);
            const self = this;

            model.update = function() {
              const result = origUpdate();
              // 应用参数覆盖
              for (const [paramId, value] of Object.entries(self.paramOverrides)) {
                const idx = params.ids.indexOf(paramId);
                if (idx >= 0) params.values[idx] = value;
              }
              return result;
            };

            // 启动视线跟随
            this._startGazeTracking();
          },

          // ========== 视线跟随 ==========
          _startGazeTracking() {
            let mouseX = window.innerWidth / 2;
            let mouseY = window.innerHeight / 2;
            // 当前平滑值
            let currentAngleX = 0, currentAngleY = 0;
            let currentEyeX = 0, currentEyeY = 0;
            let currentBodyX = 0;
            const self = this;

            document.addEventListener('mousemove', (e) => {
              mouseX = e.clientX;
              mouseY = e.clientY;
            });

            const animate = () => {
              if (!self.gazeEnabled || !self.coreModel) {
                requestAnimationFrame(animate);
                return;
              }

              const waifu = document.getElementById('waifu');
              if (!waifu) { requestAnimationFrame(animate); return; }

              const rect = waifu.getBoundingClientRect();
              const centerX = rect.left + rect.width / 2;
              const centerY = rect.top + rect.height * 0.35; // 脸部大致位置

              // 计算鼠标相对于看板娘脸部的归一化偏移 (-1 ~ 1)
              const dx = (mouseX - centerX) / (window.innerWidth * 0.5);
              const dy = (mouseY - centerY) / (window.innerHeight * 0.5);

              // 目标参数值
              const targetAngleX = Math.max(-30, Math.min(30, dx * 25));
              const targetAngleY = Math.max(-30, Math.min(30, dy * 15));
              const targetEyeX = Math.max(-1, Math.min(1, dx * 0.9));
              const targetEyeY = Math.max(-1, Math.min(1, dy * 0.6));
              const targetBodyX = Math.max(-10, Math.min(10, dx * 6));

              // lerp 平滑过渡 (越小越平滑)
              const lerp = 0.08;
              currentAngleX += (targetAngleX - currentAngleX) * lerp;
              currentAngleY += (targetAngleY - currentAngleY) * lerp;
              currentEyeX += (targetEyeX - currentEyeX) * lerp;
              currentEyeY += (targetEyeY - currentEyeY) * lerp;
              currentBodyX += (targetBodyX - currentBodyX) * lerp;

              // 设置覆盖（不覆盖说话参数）
              self.paramOverrides['ParamAngleX'] = currentAngleX;
              self.paramOverrides['ParamAngleY'] = currentAngleY;
              self.paramOverrides['ParamEyeBallX'] = currentEyeX;
              self.paramOverrides['ParamEyeBallY'] = currentEyeY;
              self.paramOverrides['ParamBodyAngleX'] = currentBodyX;

              // 情绪表情 lerp 过渡
              if (self.emotionTarget) {
                const now = Date.now();
                const isActive = now < self.emotionEndTime;
                for (const [param, targetVal] of Object.entries(self.emotionTarget)) {
                  if (!self.emotionCurrent[param]) self.emotionCurrent[param] = 0;
                  const target = isActive ? targetVal : 0;
                  self.emotionCurrent[param] += (target - self.emotionCurrent[param]) * 0.1;
                  self.paramOverrides[param] = self.emotionCurrent[param];
                }
                if (!isActive && Math.abs(self.emotionCurrent[Object.keys(self.emotionTarget)[0]]) < 0.01) {
                  self.emotionTarget = null;
                  self.emotionCurrent = {};
                }
              }

              requestAnimationFrame(animate);
            };
            animate();
          },

          // ========== 点击弹跳 ==========
          triggerBounce() {
            if (this.bouncing) return;
            this.bouncing = true;
            const waifu = document.getElementById('waifu');
            if (!waifu) { this.bouncing = false; return; }
            waifu.classList.add('waifu-bounce');
            // 弹跳时配合表情
            this.paramOverrides['ParamEyeLSmile'] = 1;
            this.paramOverrides['ParamEyeRSmile'] = 1;
            this.paramOverrides['ParamMouthForm'] = 1;
            setTimeout(() => {
              waifu.classList.remove('waifu-bounce');
              delete this.paramOverrides['ParamEyeLSmile'];
              delete this.paramOverrides['ParamEyeRSmile'];
              delete this.paramOverrides['ParamMouthForm'];
              this.bouncing = false;
            }, 600);
          },

          // ========== 说话动画 ==========
          startSpeaking() {
            this.speaking = true;
            this._animateMouth();
          },

          stopSpeaking() {
            this.speaking = false;
            if (this.speakTimer) {
              cancelAnimationFrame(this.speakTimer);
              this.speakTimer = null;
            }
            delete this.paramOverrides['ParamMouthOpenY'];
          },

          // 按回复文字长度说话
          speakForDuration(ms) {
            this.startSpeaking();
            setTimeout(() => this.stopSpeaking(), Math.min(ms, 5000));
          },

          _animateMouth() {
            if (!this.speaking) return;
            const t = Date.now() * 0.015;
            // 随机节奏的嘴巴开合，模拟说话
            const openness = Math.abs(Math.sin(t)) * (0.3 + Math.random() * 0.4);
            this.paramOverrides['ParamMouthOpenY'] = openness;
            this.speakTimer = requestAnimationFrame(() => this._animateMouth());
          },

          // ========== 情绪表情 ==========
          showEmotion(name, durationMs = 3000) {
            if (!EMOTIONS[name]) return;
            this.emotionTarget = EMOTIONS[name];
            this.emotionEndTime = Date.now() + durationMs;
            this.emotionCurrent = {};
          }
        };

        // 暴露到全局供聊天脚本调用
        window.__waifuModelCtrl = modelCtrl;

        // ========== 自由漫游管理器 ==========
        const roamManager = {
          state: 'idle',
          idleTimer: null,
          position: { x: 0 },
          target: { x: 0 },
          direction: 1,
          animFrame: null,
          IDLE_TIMEOUT: 30000,
          SPEED: 2,

          start() {
            this.resetIdleTimer();
            ['mousemove', 'mousedown', 'keydown', 'scroll'].forEach(evt =>
              document.addEventListener(evt, () => this.onUserActivity(), { passive: true })
            );
          },

          resetIdleTimer() {
            clearTimeout(this.idleTimer);
            this.idleTimer = setTimeout(() => this.enterRoaming(), this.IDLE_TIMEOUT);
          },

          onUserActivity() {
            if (this.state === 'roaming') this.returnHome();
            this.resetIdleTimer();
          },

          enterRoaming() {
            if (dndToggle.enabled) return;
            const chatMode = document.querySelector('#waifu-tips.waifu-chat-mode');
            if (chatMode) return;
            this.state = 'roaming';
            this.pickNewTarget();
            this.animateWalk();
          },

          pickNewTarget() {
            const waifu = document.getElementById('waifu');
            if (!waifu) return;
            const minX = 100;
            const maxX = window.innerWidth - 200;
            this.target.x = minX + Math.random() * (maxX - minX) - waifu.getBoundingClientRect().left;
          },

          animateWalk() {
            if (this.state !== 'roaming') return;
            const waifu = document.getElementById('waifu');
            if (!waifu) return;

            const dx = this.target.x - this.position.x;
            if (Math.abs(dx) < 5) {
              setTimeout(() => {
                if (this.state === 'roaming') this.pickNewTarget();
              }, 2000 + Math.random() * 3000);
              this.animFrame = requestAnimationFrame(() => this.animateWalk());
              return;
            }

            const newDir = dx > 0 ? 1 : -1;
            if (newDir !== this.direction) {
              this.direction = newDir;
              waifu.style.transform = newDir < 0 ? 'scaleX(-1)' : '';
            }

            this.position.x += Math.sign(dx) * this.SPEED;
            waifu.style.left = `calc(var(--waifu-home-left, auto) + ${this.position.x}px)`;

            const walkPhase = Date.now() * 0.008;
            waifu.style.marginBottom = Math.sin(walkPhase * Math.PI * 4) * 3 + 'px';
            modelCtrl.paramOverrides['ParamBodyAngleX'] = Math.sin(walkPhase * Math.PI * 4) * 5;

            this.animFrame = requestAnimationFrame(() => this.animateWalk());
          },

          returnHome() {
            this.state = 'returning';
            const waifu = document.getElementById('waifu');
            if (!waifu) return;
            if (this.animFrame) cancelAnimationFrame(this.animFrame);
            waifu.style.transition = 'left 0.8s ease-in-out';
            waifu.style.left = '';
            waifu.style.transform = '';
            waifu.style.marginBottom = '';
            this.position.x = 0;
            this.direction = 1;
            delete modelCtrl.paramOverrides['ParamBodyAngleX'];
            setTimeout(() => {
              waifu.style.transition = '';
              this.state = 'idle';
              this.resetIdleTimer();
            }, 800);
          }
        };

        // ========== 拖拽管理器 ==========
        const dragManager = {
          dragging: false,
          longPressTimer: null,
          startPos: { x: 0, y: 0 },
          LONG_PRESS_MS: 150,

          init(canvas) {
            canvas.addEventListener('mousedown', (e) => this.onMouseDown(e));
            document.addEventListener('mousemove', (e) => this.onMouseMove(e));
            document.addEventListener('mouseup', () => this.onMouseUp());
            canvas.addEventListener('click', (e) => {
              if (!this.dragging && !this.longPressTimer) modelCtrl.triggerBounce();
            });
          },

          onMouseDown(e) {
            this.startPos = { x: e.clientX, y: e.clientY };
            this.longPressTimer = setTimeout(() => this.enterDrag(), this.LONG_PRESS_MS);
          },

          enterDrag() {
            this.dragging = true;
            if (roamManager.state === 'roaming') roamManager.returnHome();
            modelCtrl.gazeEnabled = false;
            modelCtrl.showEmotion('surprise', 2000);
            const waifu = document.getElementById('waifu');
            if (waifu) {
              waifu.style.cursor = 'grabbing';
              waifu.style.transition = 'none';
            }
          },

          onMouseMove(e) {
            if (!this.dragging) return;
            const dx = e.clientX - this.startPos.x;
            const dy = e.clientY - this.startPos.y;
            const waifu = document.getElementById('waifu');
            if (waifu) waifu.style.transform = `translate(${dx}px, ${dy}px)`;
          },

          onMouseUp() {
            clearTimeout(this.longPressTimer);
            if (!this.dragging) return;
            this.dragging = false;
            const waifu = document.getElementById('waifu');
            if (waifu) {
              waifu.style.cursor = '';
            }
            modelCtrl.gazeEnabled = true;
          }
        };

        // ========== 勿扰模式 ==========
        const dndToggle = {
          enabled: false,
          STORAGE_KEY: 'waifu-dnd-mode',

          init(toolBar) {
            this.enabled = localStorage.getItem(this.STORAGE_KEY) === 'true';
            this.createIcon(toolBar);
            if (this.enabled) this.apply();
          },

          toggle() {
            this.enabled = !this.enabled;
            localStorage.setItem(this.STORAGE_KEY, this.enabled);
            this.apply();
          },

          apply() {
            const icon = document.querySelector('#waifu-tool span[data-tool="dnd"]');
            if (this.enabled) {
              if (icon) icon.classList.add('waifu-dnd-active');
              if (roamManager.state === 'roaming') roamManager.returnHome();
            } else {
              if (icon) icon.classList.remove('waifu-dnd-active');
              roamManager.resetIdleTimer();
            }
          },

          createIcon(toolBar) {
            const icon = document.createElement('span');
            icon.dataset.tool = 'dnd';
            icon.title = '勿扰模式';
            icon.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><path d="M283.2 35.6C191.5 43.4 118.4 120.5 118.4 214.4c0 100.3 81.3 181.6 181.6 181.6 93.9 0 171-73.1 178.8-164.8-18.4 27.9-50.1 46.4-86.4 46.4-57.4 0-104-46.6-104-104 0-36.3 18.5-68 46.4-86.4-.8-.1-34.2-7.2-51.6-51.6z"/></svg>';
            icon.addEventListener('click', () => this.toggle());
            const quitIcon = toolBar.querySelector('span[data-tool="quit"]');
            if (quitIcon) toolBar.insertBefore(icon, quitIcon);
            else toolBar.appendChild(icon);
            if (this.enabled) icon.classList.add('waifu-dnd-active');
          }
        };

        // ========== 智能出现模式 ==========
        const smartAppearance = {
          cooldowns: {},
          COOLDOWN_MS: 30000,

          init() {
            this.trackIdleTime();
          },

          canTrigger(eventType) {
            if (dndToggle.enabled) return false;
            if (document.querySelector('#waifu-tips.waifu-chat-mode')) return false;
            const last = this.cooldowns[eventType] || 0;
            return Date.now() - last > this.COOLDOWN_MS;
          },

          trigger(eventType, message, emotion, durationMs = 5000) {
            if (!this.canTrigger(eventType)) return;
            this.cooldowns[eventType] = Date.now();
            if (typeof showMessage === 'function') showMessage(message, durationMs);
            if (emotion) modelCtrl.showEmotion(emotion, durationMs);
          },

          trackIdleTime() {
            let idleTimer;
            const messages = [
              '主人，还在吗？(◕ᴗ◕✿)',
              '要不要休息一下？眼睛会累的哦~',
              '好安静呀...主人在思考什么呢？',
              '无聊的话可以跟我聊天哦！点击 💬 按钮~'
            ];
            const resetTimer = () => {
              clearTimeout(idleTimer);
              idleTimer = setTimeout(() => {
                const msg = messages[Math.floor(Math.random() * messages.length)];
                this.trigger('idle', msg, 'shy');
                resetTimer();
              }, 60000);
            };
            document.addEventListener('mousemove', resetTimer, { passive: true });
            document.addEventListener('keydown', resetTimer, { passive: true });
            resetTimer();
          }
        };

        // ========== 初始化 ==========
        function waitForCanvas() {
          const check = () => {
            const canvas = document.getElementById('live2d');
            if (canvas) {
              modelCtrl.init();
              dragManager.init(canvas);
            } else {
              setTimeout(check, 300);
            }
          };
          check();
        }

        function waitForWaifuTools() {
          const check = () => {
            const tool = document.getElementById('waifu-tool');
            if (tool) {
              dndToggle.init(tool);
            } else {
              setTimeout(check, 300);
            }
          };
          check();
        }

        waitForCanvas();
        waitForWaifuTools();
        roamManager.start();
        smartAppearance.init();

        // 暴露管理器到全局（用于测试）
        window.__waifuRoamManager = roamManager;
        window.__waifuDndToggle = dndToggle;
      })();
    </script>
    <!-- 看板娘位置调整：移到右下角，避开左侧 Sidebar -->

      @keyframes waifu-bounce-anim {

        to { opacity: 1; transform: translateY(0); }
      }
      .waifu-chat-ai {
        align-self: flex-start;
        background: rgba(60, 80, 140, 0.6);
        color: #e2e8f0;
        border-bottom-left-radius: 3px;
      }
      .waifu-chat-user {
        align-self: flex-end;

        border-bottom-right-radius: 3px;

      .waifu-chat-loading {
        opacity: 0.6;

      }
      .waifu-chat-error {
        color: #fca5a5 !important;
      }
      .waifu-chat-input-wrap {
        padding: 8px 10px;
        border-top: 1px solid rgba(100, 140, 255, 0.2);
      }
      #waifu-chat-input {
        width: 100%;
        background: rgba(30, 40, 70, 0.8);
        border: 1px solid rgba(100, 140, 255, 0.3);
        border-radius: 8px;
        color: #e2e8f0;
        padding: 6px 10px;
        font-size: 13px;
        font-family: inherit;
        resize: none;
        outline: none;
        line-height: 1.4;

      #waifu-chat-input:focus {
        border-color: rgba(96, 165, 250, 0.6);

      #waifu-chat-input:disabled {

      #waifu-chat-input::placeholder {

      }
      /* 聊天图标激活状态 */
      #waifu-tool span.waifu-chat-active {

      /* 勿扰模式图标 */
      #waifu-tool span[data-tool="dnd"] svg {

      }

      /* 拖拽光标 */
      #waifu.waifu-dragging {
        cursor: grabbing !important;
      }
      #waifu.waifu-dragging canvas {
        cursor: grabbing !important;
      }
    </style>
  </body>
