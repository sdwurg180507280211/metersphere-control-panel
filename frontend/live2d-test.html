<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live2D 模型测试</title>
  <style>
    :root {
      --primary-color: #6366f1;
      --primary-hover: #4f46e5;
      --secondary-color: #ec4899;
      --success-color: #10b981;
      --warning-color: #f59e0b;
      --danger-color: #ef4444;
      --bg-color: #0f0f1a;
      --sidebar-bg: rgba(15, 15, 26, 0.95);
      --sidebar-border: rgba(99, 102, 241, 0.2);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent-glow: rgba(99, 102, 241, 0.3);
      --drawer-width: 380px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--bg-color);
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: var(--text-primary);
      overflow: hidden;
    }

    /* Canvas 容器 */
    #canvas-container {
      position: fixed;
      top: 0;
      left: var(--drawer-width);
      right: 0;
      bottom: 0;
      width: calc(100vw - var(--drawer-width));
      height: 100vh;
      background: radial-gradient(circle at center, rgba(99, 102, 241, 0.1) 0%, transparent 70%);
      overflow: hidden;
    }

    #canvas-container canvas {
      display: block;
    }

    /* 侧边栏抽屉 */
    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: var(--drawer-width);
      height: 100vh;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--sidebar-border);
      z-index: 100;
      display: flex;
      flex-direction: column;
      transition: transform 0.3s ease;
      backdrop-filter: blur(20px);
    }

    .sidebar.collapsed {
      transform: translateX(calc(-1 * var(--drawer-width)));
    }

    /* 顶部标题栏 */
    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid var(--sidebar-border);
      background: rgba(99, 102, 241, 0.1);
    }

    .sidebar-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      border: none;
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-primary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .icon-btn:hover {
      background: rgba(99, 102, 241, 0.3);
    }

    .icon-btn:active {
      transform: scale(0.95);
    }

    /* 侧边栏内容区 */
    .sidebar-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }

    .sidebar-content::-webkit-scrollbar {
      width: 6px;
    }

    .sidebar-content::-webkit-scrollbar-thumb {
      background: rgba(99, 102, 241, 0.3);
      border-radius: 3px;
    }

    /* 折叠面板组 */
    .accordion-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .accordion {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(99, 102, 241, 0.15);
      border-radius: 12px;
      overflow: hidden;
      transition: all 0.2s;
    }

    .accordion-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      background: transparent;
      border: none;
      color: var(--text-primary);
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      width: 100%;
      text-align: left;
      transition: background 0.2s;
    }

    .accordion-header:hover {
      background: rgba(99, 102, 241, 0.1);
    }

    .accordion-header .title {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .accordion-icon {
      width: 20px;
      height: 20px;
      transition: transform 0.3s;
    }

    .accordion.open .accordion-icon {
      transform: rotate(90deg);
    }

    .accordion-badge {
      margin-left: auto;
      font-size: 0.75rem;
      color: var(--text-secondary);
      background: rgba(99, 102, 241, 0.2);
      padding: 2px 8px;
      border-radius: 10px;
    }

    .accordion-body {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease;
    }

    .accordion.open .accordion-body {
      max-height: 1000px;
    }

    .accordion-inner {
      padding: 12px 16px 16px;
    }

    /* 模型选择按钮 */
    .model-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .model-btn {
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid rgba(99, 102, 241, 0.3);
      background: rgba(99, 102, 241, 0.1);
      color: var(--text-primary);
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }

    .model-btn:hover {
      background: rgba(99, 102, 241, 0.2);
      transform: translateY(-2px);
    }

    .model-btn.active {
      background: linear-gradient(135deg, var(--primary-color), var(--primary-hover));
      border-color: transparent;
      box-shadow: 0 4px 15px var(--accent-glow);
    }

    .model-btn small {
      display: block;
      font-size: 0.7rem;
      color: rgba(255, 255, 255, 0.7);
      margin-top: 4px;
      font-weight: normal;
    }

    /* 动作列表 */
    .motion-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .motion-item {
      display: flex;
      align-items: center;
      padding: 10px 12px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(99, 102, 241, 0.1);
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
      overflow: hidden;
    }

    .motion-item:hover {
      background: rgba(99, 102, 241, 0.15);
      border-color: var(--primary-color);
    }

    .motion-item.playing {
      background: rgba(99, 102, 241, 0.2);
      border-color: var(--primary-color);
    }

    .motion-item.playing::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: var(--progress, 0%);
      background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
      opacity: 0.2;
      transition: width 0.1s;
    }

    .motion-icon {
      font-size: 1.1rem;
      margin-right: 10px;
    }

    .motion-name {
      flex: 1;
      font-size: 0.85rem;
      font-weight: 500;
    }

    .motion-group-label {
      font-size: 0.7rem;
      color: var(--text-secondary);
      background: rgba(255, 255, 255, 0.05);
      padding: 2px 6px;
      border-radius: 4px;
      margin-left: 8px;
    }

    .motion-section {
      margin-bottom: 12px;
    }

    .motion-section-title {
      font-size: 0.75rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      padding-left: 4px;
    }

    /* 滑块 */
    .slider-item {
      margin-bottom: 16px;
    }

    .slider-item:last-child {
      margin-bottom: 0;
    }

    .slider-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 0.8rem;
      color: var(--text-secondary);
    }

    .slider-value {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--primary-color);
      background: rgba(99, 102, 241, 0.15);
      padding: 3px 8px;
      border-radius: 4px;
      min-width: 50px;
      text-align: center;
    }

    input[type="range"] {
      width: 100%;
      height: 5px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.1);
      outline: none;
      -webkit-appearance: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
      cursor: pointer;
      box-shadow: 0 2px 10px var(--accent-glow);
      transition: transform 0.2s;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.15);
    }

    /* 复选框 */
    .checkbox-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    .checkbox-item:hover {
      background: rgba(99, 102, 241, 0.1);
    }

    .checkbox-item input {
      width: 16px;
      height: 16px;
      accent-color: var(--primary-color);
      cursor: pointer;
    }

    /* 表情列表 */
    .expression-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .expression-btn {
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid rgba(99, 102, 241, 0.2);
      background: rgba(255, 255, 255, 0.03);
      color: var(--text-primary);
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .expression-btn:hover {
      background: rgba(99, 102, 241, 0.2);
    }

    .expression-btn.active {
      background: rgba(236, 72, 153, 0.2);
      border-color: var(--secondary-color);
    }

    /* 重置按钮 */
    .btn-reset {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid rgba(239, 68, 68, 0.3);
      background: rgba(239, 68, 68, 0.1);
      color: var(--text-primary);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 16px;
    }

    .btn-reset:hover {
      background: rgba(239, 68, 68, 0.2);
      border-color: var(--danger-color);
    }

    /* 状态栏 */
    .status-bar {
      position: fixed;
      bottom: 20px;
      left: calc(var(--drawer-width) + 20px);
      background: rgba(15, 15, 26, 0.9);
      backdrop-filter: blur(20px);
      border: 1px solid var(--sidebar-border);
      border-radius: 12px;
      padding: 10px 16px;
      font-size: 0.8rem;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 50;
      transition: left 0.3s;
    }

    .sidebar.collapsed ~ .status-bar {
      left: 20px;
    }

    .status-indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success-color);
      animation: pulse 2s ease-in-out infinite;
    }

    .status-indicator.loading {
      background: var(--warning-color);
    }

    .status-indicator.error {
      background: var(--danger-color);
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; box-shadow: 0 0 10px currentColor; }
      50% { opacity: 0.5; box-shadow: 0 0 5px currentColor; }
    }

    /* 模型名称显示 */
    .model-name-display {
      text-align: center;
      padding: 12px;
      border-bottom: 1px solid var(--sidebar-border);
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-primary);
      background: rgba(99, 102, 241, 0.05);
    }

    .model-name-display span {
      color: var(--primary-color);
    }

    /* 空状态提示 */
    .empty-state {
      text-align: center;
      padding: 20px;
      color: var(--text-secondary);
      font-size: 0.8rem;
    }

    /* 响应式 */
    @media (max-width: 768px) {
      :root {
        --drawer-width: 320px;
      }

      .sidebar {
        transform: translateX(calc(-1 * var(--drawer-width)));
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .status-bar {
        left: 50%;
        transform: translateX(-50%);
        bottom: 80px;
      }
    }
  </style>

  <!-- Cubism Core -->
  <script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>
</head>
<body>
  <!-- Canvas 容器 - 全屏 -->
  <div id="canvas-container"></div>

  <!-- 侧边栏 -->
  <div class="sidebar" id="sidebar">
    <!-- 顶部 -->
    <div class="sidebar-header">
      <div class="sidebar-title">
        <span>🎭</span> Live2D Viewer
      </div>
      <div class="header-actions">
        <button class="icon-btn" onclick="toggleSidebar()" title="切换面板">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- 模型名称 -->
    <div class="model-name-display">
      当前模型：<span id="current-model-display">Rice</span>
    </div>

    <!-- 内容区 -->
    <div class="sidebar-content">
      <div class="accordion-group">

        <!-- 模型选择 -->
        <div class="accordion open">
          <button class="accordion-header" onclick="toggleAccordion(this)">
            <div class="title">
              <svg class="accordion-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 18l6-6-6-6"/>
              </svg>
              模型选择
            </div>
          </button>
          <div class="accordion-body">
            <div class="accordion-inner">
              <div class="model-grid" id="model-select">
                <!-- 动态生成 -->
              </div>
            </div>
          </div>
        </div>

        <!-- 动作控制 -->
        <div class="accordion">
          <button class="accordion-header" onclick="toggleAccordion(this)">
            <div class="title">
              <svg class="accordion-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 18l6-6-6-6"/>
              </svg>
              动作控制
            </div>
            <span class="accordion-badge" id="motion-count">0</span>
          </button>
          <div class="accordion-body">
            <div class="accordion-inner">
              <div class="motion-list" id="motion-buttons">
                <!-- 动态生成 -->
              </div>
            </div>
          </div>
        </div>

        <!-- 表情控制 -->
        <div class="accordion">
          <button class="accordion-header" onclick="toggleAccordion(this)">
            <div class="title">
              <svg class="accordion-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 18l6-6-6-6"/>
              </svg>
              表情控制
            </div>
            <span class="accordion-badge" id="expression-count">0</span>
          </button>
          <div class="accordion-body">
            <div class="accordion-inner">
              <div class="expression-list" id="expression-buttons">
                <div class="empty-state">暂无可用表情</div>
              </div>
            </div>
          </div>
        </div>

        <!-- 显示设置 -->
        <div class="accordion open">
          <button class="accordion-header" onclick="toggleAccordion(this)">
            <div class="title">
              <svg class="accordion-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 18l6-6-6-6"/>
              </svg>
              显示设置
            </div>
          </button>
          <div class="accordion-body">
            <div class="accordion-inner">
              <!-- 缩放 -->
              <div class="slider-item">
                <div class="slider-label">
                  <span>缩放</span>
                  <span class="slider-value" id="scale-value">0.15</span>
                </div>
                <input type="range" id="scale-slider" min="0.01" max="0.5" step="0.01" value="0.15">
              </div>
              <!-- 位置 X -->
              <div class="slider-item">
                <div class="slider-label">
                  <span>位置 X</span>
                  <span class="slider-value" id="pos-x-value">400</span>
                </div>
                <input type="range" id="pos-x-slider" min="0" max="800" step="10" value="400">
              </div>
              <!-- 位置 Y -->
              <div class="slider-item">
                <div class="slider-label">
                  <span>位置 Y</span>
                  <span class="slider-value" id="pos-y-value">500</span>
                </div>
                <input type="range" id="pos-y-slider" min="0" max="800" step="10" value="500">
              </div>
              <!-- 旋转 -->
              <div class="slider-item">
                <div class="slider-label">
                  <span>旋转</span>
                  <span class="slider-value" id="rotation-value">0°</span>
                </div>
                <input type="range" id="rotation-slider" min="-180" max="180" step="5" value="0">
              </div>
            </div>
          </div>
        </div>

        <!-- 参数控制 -->
        <div class="accordion open">
          <button class="accordion-header" onclick="toggleAccordion(this)">
            <div class="title">
              <svg class="accordion-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 18l6-6-6-6"/>
              </svg>
              🎚️ 参数控制
            </div>
            <span class="accordion-badge" id="param-count">0</span>
          </button>
          <div class="accordion-body">
            <div class="accordion-inner">
              <div id="parameter-sliders" style="max-height: 400px; overflow-y: auto; padding-right: 4px;">
                <div class="empty-state">加载模型后显示参数...</div>
              </div>
            </div>
          </div>
        </div>

        <!-- 语音控制 -->
        <div class="accordion open">
          <button class="accordion-header" onclick="toggleAccordion(this)">
            <div class="title">
              <svg class="accordion-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 18l6-6-6-6"/>
              </svg>
              🎤 语音控制
            </div>
            <span class="accordion-badge" id="voice-status">TTS: 就绪</span>
          </button>
          <div class="accordion-body">
            <div class="accordion-inner">
              <!-- TTS 文字转语音 -->
              <div class="motion-section">
                <div class="motion-section-title">文字转语音 (TTS)</div>
                <div class="voice-tts">
                  <textarea id="tts-text" placeholder="输入要朗读的文字..." rows="3" style="
                    width: 100%;
                    box-sizing: border-box;
                    padding: 8px 12px;
                    border-radius: 8px;
                    border: 1px solid rgba(99, 102, 241, 0.2);
                    background: rgba(255, 255, 255, 0.03);
                    color: var(--text-primary);
                    font-size: 0.8rem;
                    resize: vertical;
                    margin-bottom: 8px;
                  ">你好呀，我是看板娘小梦，很高兴见到你。</textarea>
                  <div class="slider-item" style="margin-bottom: 12px;">
                    <div class="slider-label">
                      <span>语速</span>
                      <span class="slider-value" id="tts-rate-value">0.9</span>
                    </div>
                    <input type="range" id="tts-rate-slider" min="0.5" max="1.5" step="0.1" value="0.9">
                  </div>
                  <div class="slider-item" style="margin-bottom: 12px;">
                    <div class="slider-label">
                      <span>音调</span>
                      <span class="slider-value" id="tts-pitch-value">1.1</span>
                    </div>
                    <input type="range" id="tts-pitch-slider" min="0.5" max="2.0" step="0.1" value="1.1">
                  </div>
                  <div class="checkbox-list" style="margin-bottom: 10px;">
                    <label class="checkbox-item">
                      <input type="checkbox" id="tts-enabled" checked>
                      启用 TTS
                    </label>
                  </div>
                  <div style="display: flex; gap: 8px;">
                    <button class="model-btn" id="btn-tts-speak" style="flex: 1; padding: 8px;">
                      🔊 朗读
                    </button>
                    <button class="model-btn" id="btn-tts-stop" style="flex: 1; padding: 8px; background: rgba(239, 68, 68, 0.1); border-color: rgba(239, 68, 68, 0.3);">
                      ⏹ 停止
                    </button>
                  </div>
                </div>
              </div>

              <!-- ASR 语音识别 -->
              <div class="motion-section">
                <div class="motion-section-title">语音识别 (ASR)</div>
                <div class="voice-asr">
                  <div id="asr-result" style="
                    min-height: 40px;
                    padding: 8px 12px;
                    border-radius: 8px;
                    border: 1px solid rgba(99, 102, 241, 0.2);
                    background: rgba(255, 255, 255, 0.03);
                    color: var(--text-secondary);
                    font-size: 0.8rem;
                    margin-bottom: 8px;
                  ">识别结果将显示在这里...</div>
                  <div class="checkbox-list" style="margin-bottom: 10px;">
                    <label class="checkbox-item">
                      <input type="checkbox" id="asr-enabled" checked>
                      启用 ASR
                    </label>
                  </div>
                  <button class="model-btn" id="btn-asr-start" style="width: 100%; padding: 8px; background: rgba(236, 72, 153, 0.1); border-color: rgba(236, 72, 153, 0.3);">
                    🎤 开始录音
                  </button>
                </div>
              </div>

              <!-- LipSync 调试 -->
              <div class="motion-section">
                <div class="motion-section-title">嘴型同步调试</div>
                <div class="checkbox-list">
                  <label class="checkbox-item">
                    <input type="checkbox" id="lipsync-enabled" checked>
                    启用嘴型同步
                  </label>
                </div>
                <div class="slider-item" style="margin-top: 12px; margin-bottom: 12px;">
                  <div class="slider-label">
                    <span>字符速率 (字符/秒)</span>
                    <span class="slider-value" id="cps-value">12</span>
                  </div>
                  <input type="range" id="cps-slider" min="5" max="20" step="1" value="12">
                </div>
                <div class="slider-item" style="margin-bottom: 12px;">
                  <div class="slider-label">
                    <span>平滑速度</span>
                    <span class="slider-value" id="smooth-value">8</span>
                  </div>
                  <input type="range" id="smooth-slider" min="1" max="20" step="1" value="8">
                </div>
                <div style="text-align: center; font-size: 0.75rem; color: var(--text-secondary); margin-top: 8px;">
                  当前嘴型开度: <span id="mouth-open-value">0</span>
                </div>
              </div>

              <!-- AI 聊天 -->
              <div class="motion-section" style="margin-top: 16px;">
                <div class="motion-section-title">AI 对话</div>
                <div id="chat-history" style="
                  max-height: 150px;
                  overflow-y: auto;
                  padding: 8px;
                  border-radius: 8px;
                  border: 1px solid rgba(99, 102, 241, 0.2);
                  background: rgba(255, 255, 255, 0.02);
                  margin-bottom: 8px;
                "></div>
                <div style="display: flex; gap: 8px;">
                  <input id="chat-input" type="text" placeholder="输入消息..." style="
                    flex: 1;
                    padding: 8px 12px;
                    border-radius: 8px;
                    border: 1px solid rgba(99, 102, 241, 0.2);
                    background: rgba(255, 255, 255, 0.03);
                    color: var(--text-primary);
                    font-size: 0.8rem;
                  ">
                  <button class="model-btn" id="btn-chat-send" style="width: 80px; padding: 8px;">
                    📤 发送
                  </button>
                </div>
                <div style="margin-top: 8px;" class="checkbox-list">
                  <label class="checkbox-item">
                    <input type="checkbox" id="auto-tts-reply" checked>
                    自动朗读 AI 回复
                  </label>
                </div>
              </div>
            </div>
          </div>
        </div>

      </div>

      <!-- 重置按钮 -->
      <button class="btn-reset" onclick="resetModel()">🔄 重置模型</button>
    </div>
  </div>

  <!-- 状态栏 -->
  <div class="status-bar">
    <div class="status-indicator" id="status-indicator"></div>
    <span id="status">正在初始化...</span>
  </div>

  <script type="module" src="/src/live2d-test/main.tsx"></script>
  <script>
    // UI 控制函数
    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      sidebar.classList.toggle('collapsed');

      // 移动端支持
      if (window.innerWidth <= 768) {
        sidebar.classList.toggle('open');
      }
    }

    function toggleAccordion(header) {
      const accordion = header.closest('.accordion');
      accordion.classList.toggle('open');
    }

    // 移动端初始化
    if (window.innerWidth <= 768) {
      document.getElementById('sidebar').classList.add('collapsed');
    }
  </script>
</body>
</html>
